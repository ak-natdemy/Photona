<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Event - Photona</title>

</head>

<body>

    <h1>Create Event</h1>

    <p>
        Create a new event for
        <strong>{{ request.user.tenant.name }}</strong>
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Event
        </button>

    </form>

    <br>

    <a href="{% url 'dashboard' %}">
        ← Back to Dashboard
    </a>

</body>

</html>
