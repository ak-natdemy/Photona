<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Photos - {{ event.name }}</title>

</head>

<body>

    <h1>Upload Photos</h1>

    <h2>{{ event.name }}</h2>

    <form
        method="post"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Upload Photos
        </button>

    </form>

    <br>

    <a href="{% url 'events:detail' event.id %}">
        ← Back to Event
    </a>

</body>

</html>
