{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Photona</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

    <main>

        <section>

            <h1>PHOTONA</h1>

            <h2>Welcome Back</h2>

            <p>Login to your Photona account.</p>


            <!-- Login Error -->
            {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
            {% endif %}


            <!-- Login Form -->
            <form method="post" id="login-form">

                {% csrf_token %}

                <!-- Username -->
                <div>
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                    >
                </div>


                <!-- Password -->
                <div>

                    <label for="password">
                        Password
                    </label>

                    <div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            id="toggle-password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    id="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Create Account
                </a>
            </p>

        </section>

    </main>


    <script src="{% static 'js/login.js' %}"></script>

</body>

</html>
