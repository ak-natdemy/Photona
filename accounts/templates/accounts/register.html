<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Photona Account</title>

</head>

<body>

    <h1>Create your Photona account</h1>

    <p>
        Register your photography business or studio.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Account
        </button>

    </form>

    <br>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</body>

</html>
